
services:
  api:
    build:
      context: .
      dockerfile: dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      CYBER_RISK_DATA: /dados/ativos.json
      CYBER_RISK_JOURNAL: /dados/ativos_diario.jsonl
     
     # Configuração do environment do serviço api 
      CYBER_RISK_STORAGE: ${CYBER_RISK_STORAGE:-json}
      CYBER_RISK_DB: /dados/cyber_risk.db

    volumes:
      - dados_api:/dados

    restart: unless-stopped

    # Impede que processos adquiram novos privilegios
    security_opt:
      - no-new-privileges:true

    # Remove capacidades Linux desnecessarias
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados_api:
